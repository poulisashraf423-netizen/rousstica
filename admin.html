<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الرفع السري</title><link rel="stylesheet" href="/static/css/style.css"></head><body><div class="admin-wrap"><p>🔒 صفحة سرية - انت بس</p><h1>رفع فيديو جديد</h1><p>المتابعين الحالي: <b>{{ followers }}</b></p><form method="POST" enctype="multipart/form-data"><input name="title" placeholder="عنوان الفيديو" required><input type="file" name="video" accept="video/*" required><button>رفع الفيديو</button></form><hr><form method="POST"><input type="number" name="followers_count" value="{{ followers }}"><button>تحديث عدد المتابعين</button></form><h3>فيديوهاتك</h3>{% for v in videos %}<div>{{ v.title }} - <a href="/roussi-secret-2026/delete/{{ loop.index0 }}">حذف</a></div>{% endfor %}<a href="/roussi-secret-2026/logout">خروج</a></div></body></html>
